name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Gradle files - you don't have to make these
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'Wavelord-Transcriber'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace = 'com.wavelord.transcriber'
              compileSdk = 34
              defaultConfig {
                  applicationId = 'com.wavelord.transcriber'
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = '1.0'
              }
              buildTypes {
                  debug {
                      minifyEnabled = false
                  }
                  release {
                      minifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          echo "--- CHECK FILES WERE MADE ---"
          ls -la settings.gradle build.gradle app/build.gradle

      - name: Copy web + overlay into Android project
        run: |
          mkdir -p app/src/main/java/com/wavelord/transcriber
          mkdir -p app/src/main/assets/public
          mkdir -p app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          cp overlay/MainActivity.java app/src/main/java/com/wavelord/transcriber/MainActivity.java
          cp overlay/FloatingBuddy.java app/src/main/java/com/wavelord/transcriber/FloatingBuddy.java
          cp index.html app/src/main/assets/public/index.html
          if [ -f icon.png ]; then
            for d in xxxhdpi xxhdpi xhdpi hdpi mdpi; do cp icon.png app/src/main/res/mipmap-$d/ic_launcher.png; done
          else
            echo "[STRIPPED 96 bytes]" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            for d in xxhdpi xhdpi hdpi mdpi; do cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-$d/ic_launcher.png; done
          fi
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="Wavelord Transcriber" android:icon="@mipmap/ic_launcher" android:theme="@android:style/Theme.Black.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
                  <service android:name=".FloatingBuddy" android:exported="false" android:foregroundServiceType="specialUse" />
              </application>
          </manifest>
          EOF

      - name: Download Gradle from internet
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip

      - name: Build Debug APK
        run: ./gradle-8.2/bin/gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavelord-transcriber-apk
          path: app/build/outputs/apk/debug/app-debug.apk
