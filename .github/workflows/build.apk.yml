name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Copy web files
        run: |
          mkdir -p app/src/main/assets/public
          cp index.html app/src/main/assets/public/index.html
      - name: Download Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
      - name: Build Debug APK
        run: ./gradle-8.2/bin/gradle assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wavelord-transcriber-apk
          path: app/build/outputs/apk/debug/app-debug.apk
